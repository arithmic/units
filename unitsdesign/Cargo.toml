[package]
name = "unitsdesign"
version = "0.1.0"
edition = "2021"
description = "Rust-based stateless token system for ZK-VM execution environments"
authors = ["Units Team"]

[lib]
name = "unitsdesign"

[dependencies]
# No external dependencies for now to match the no_std design
# In production, would add ed25519-dalek or similar for signature verification
alloy-sol-types = { workspace = true }
sp1-zkvm = "5.0.8"
borsh = { version = "1.5.7", default-features = false, features = ["derive"] }

[features]
default = []
std = []