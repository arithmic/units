[package]
name = "workflow-layer"
version = "0.1.0"
edition = "2021"

[dependencies]
execution-engine = { path = "../execution-engine" }
tokens = { path = "../tokens" }
sp1-sdk = { version = "5.0.8" }
sp1-build = { version = "5.0.8" }
borsh = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
bincode = "1.3"
clap = { version = "4.0", features = ["derive"] }
dotenv = "0.15"

[features]
default = ["std"]
std = ["execution-engine/std"]